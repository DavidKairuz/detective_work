version: "3.9"

services:
  # 🧩 Pod 1: Generador de tráfico TCP/UDP
  traffic-generator:
    image: alpine:latest
    container_name: traffic-generator
    command: >
      sh -c "
        apk add --no-cache iperf3 netcat-openbsd;
        echo '===> Iniciando generador de tráfico';
        while true; do
          echo '>>> Enviando tráfico TCP al backend:5000';
          echo 'pingTCP $(date)' | nc backend 5000 || true;
          echo '>>> Enviando tráfico UDP al backend:5001';
          echo 'pingUDP $(date)' | nc -u -w1 backend 5001 || true;
          sleep 3;
        done
      "
    networks:
      - net-test

  # 🖥️ Pod 2: Backend receptor de tráfico TCP/UDP
  backend:
    image: alpine:latest
    container_name: backend
    command: >
      sh -c "
        apk add --no-cache socat;
        echo '===> Backend escuchando en puertos 5000 (TCP) y 5001 (UDP)';
        socat -v TCP-LISTEN:5000,reuseaddr,fork SYSTEM:'printf \"Respuesta TCP del backend\n\"' &
        socat -v UDP-RECVFROM:5001,fork SYSTEM:'printf \"Respuesta UDP del backend\n\"' &
        tail -f /dev/null
      "
    networks:
      - net-test

  # 🔍 Pod 3: Sniffer con ptcpdump
  ptcpdump-sniffer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptcpdump-sniffer
    privileged: true
    network_mode: "host"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mkdir -p /captures &&
      echo '===> Iniciando ptcpdump...' &&
      /usr/local/bin/ptcpdump -i any -n -w /captures/ptcpdump_capture.pcap"
    volumes:
      - ./captures:/captures:rw
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # 📡 Pod 4: Sniffer con tcpdump estándar
  tcpdump-sniffer:
    image: corfr/tcpdump
    container_name: tcpdump-sniffer
    privileged: true
    network_mode: "host"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mkdir -p /captures &&
      echo '===> Iniciando tcpdump...' &&
      tcpdump -i any -n -w /captures/tcpdump_capture.pcap"
    volumes:
      - ./captures:/captures:rw
    cap_add:
      - NET_ADMIN
      - NET_RAW

networks:
  net-test:
    driver: bridge