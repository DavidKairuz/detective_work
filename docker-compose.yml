#version: "3.9"

services:
  # 🧩 Pod 1: Generador de tráfico TCP/UDP
  traffic-generator:
    image: alpine:latest
    container_name: traffic-generator
    command: |
      /bin/sh -c 'while true; do
          # TCP - Enviar 3 mensajes
          echo "[TCP] Enviando mensajes..."
          for num in 1 2 3; do
              echo "TCP-DATA-$$(date +%s)-$$num" | nc backend 5000 || true
          done
          
          # UDP - Enviar 3 mensajes
          echo "[UDP] Enviando mensajes..."
          for num in 1 2 3; do
              echo "UDP-DATA-$$(date +%s)-$$num" | nc -u -w1 backend 5001 || true
          done
          
          sleep 1
      done'
    networks:
      - net-test

  # 🖥️ Pod 2: Backend receptor de tráfico TCP/UDP
  backend:
    image: alpine:latest
    container_name: backend
    command: >
      sh -c "
        apk add --no-cache socat;
        echo '===> Backend escuchando en puertos 5000 (TCP) y 5001 (UDP)';
        socat -v TCP-LISTEN:5000,reuseaddr,fork SYSTEM:'printf \"Respuesta TCP del backend\n\"' &
        socat -v UDP-RECVFROM:5001,fork SYSTEM:'printf \"Respuesta UDP del backend\n\"' &
        tail -f /dev/null
      "
    networks:
      - net-test

  # 🔍 Pod 3: Sniffer con ptcpdump
  ptcpdump-sniffer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptcpdump-sniffer
    privileged: true
    network_mode: "host"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mkdir -p /captures &&
      echo '===> Iniciando ptcpdump...' &&
      ${PTCPDUMP_CMD}"
    volumes:
      - ./captures:/captures:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
      # === AÑADIR ESTA SECCIÓN ===
    deploy:
      resources:
        limits:
          memory: 750M # Límite máximo de memoria (256 Megabytes)
          cpus: '1'  # Límite máximo de CPU (equivalente a 0.5 núcleos)
        #reservations:
        #  memory: 128M # Memoria reservada/garantizada (128 Megabytes)
        #  cpus: '0.25' # CPU reservada/garantizada (25% de un núcleo)
    # ==========================

  # 📡 Pod 4: Sniffer con tcpdump estándar
  tcpdump-sniffer:
    image: corfr/tcpdump
    container_name: tcpdump-sniffer
    privileged: true
    network_mode: "host"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mkdir -p /captures &&
      echo '===> Iniciando tcpdump...' &&
      ${TCPDUMP_CMD}"
    volumes:
      - ./captures:/captures:rw
    cap_add:
      - NET_ADMIN
      - NET_RAW
      # === AÑADIR ESTA SECCIÓN ===
    deploy:
      resources:
        limits:
          memory: 750M # Límite máximo de memoria (512 Megabytes)
          cpus: '1'  # Límite máximo de CPU (equivalente a 0.5 núcleos)
        #reservations:
       #   memory: 128M # Memoria reservada/garantizada (128 Megabytes)
        #  cpus: '0.25' # CPU reservada/garantizada (25% de un núcleo)
    # ==========================

networks:
  net-test:
    external: true
    name: ptcp_docker_net-test
    driver: bridge